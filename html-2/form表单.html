<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form表单</title>
</head>
<body>
    <form 
    method="POST"
    action="https://www.fastmock.site/mock/323354e56ef21147c3f550e18435baa1/api/login">
        <input required type="text" placeholder="请输入账号" name="username">
        <br>
        <input required type="password" placeholder="请输入密码" name="password">
        <br>
        <input type="radio" name="sex" value="男">男  <input name="sex" type="radio" value="女">女
        <br>
        <input name="hobby" type="checkbox" value="1">画画
        <input name="hobby" type="checkbox" value="2">看电影
        <input name="hobby" type="checkbox" value="3">写代码
        <br>
        <select name="type" placeholder="请选择" id="">
            <option value="1">前端</option>
            <option value="1">后端</option>
            <option value="1">全栈</option>
        </select>
        <br>
        <textarea name="dec" placeholder="请输入你的备注" id="" cols="30" rows="10"></textarea>
        <br>
        <button type="submit">注册</button>
        <button type="reset">重置</button>
    </form>
</body>
</html>
