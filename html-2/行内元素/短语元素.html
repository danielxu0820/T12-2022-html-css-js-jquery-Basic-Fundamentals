<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短语元素</title>
</head>
<body>
    <em>强调文本</em>
    <br>
    <i>斜体文本</i>

    <hr>
    <strong>语义更强，表示更重要</strong>
    <br>
    <b>文本加粗</b>

    <hr>
    <u>添加下划线</u>
    <s>添加删除线</s>
    <mark>添加标记</mark>



</body>
</html>
