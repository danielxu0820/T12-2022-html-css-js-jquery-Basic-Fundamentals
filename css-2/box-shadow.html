<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-shadow</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            border:1px solid #000;
            margin: 50px;
            /* -5 水平位置 -5垂直位置 10px 模糊距离 5px 阴影尺寸 #999阴影颜色 inset 内阴影（不写则是外阴影）  */
            /* box-shadow: -5px -5px 10px 5px #999 inset; */
            box-shadow: 5px 5px 10px 5px #999;
        }
       
    </style>
</head>
<body>
    <div>
        我是一个div
    </div>
</body>
</html>
