<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font-shadow</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            /* background-color: #efefef; */
        }
        p{
            font-size: 16px;
            text-shadow:#999 1px 1px 3px,yellow 2px 2px 3px,red 3px 3px 3px;
            
        }
    </style>
</head>
<body>
    
    <div>我是一个div
        <p>我是div内的一个p标签的文字</p>
    </div>
</body>
</html>
