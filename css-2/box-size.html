<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-size</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            border:1px solid red;
            box-sizing: content-box;
            padding: 20px;
        }

</head>
<body>
    <div>
        我是一个div
    </div>
</body>
</html>
