<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: #efefef;
            /* 给文字设定颜色 */
            color: red;
        }
        p{
            background-color: pink;
            color: #efefef;
        }
    </style>
</head>
<body>
    
    <div>我是一个div
        <p>我是div内的一个p标签的文字</p>
    </div>
</body>
</html>
