<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            border: 1px solid red;
           
            /* 上 右 下 左 */
            padding:10px 11px 12px 13px;
            /* 上右下 左边取右边的值 */
            padding:10px 11px 12px;
            /* 上右 下和左取上和右的值 */
            padding: 10px 11px;
             /* 四面都是10px */
            padding:10px;
        }
       
    </style>
</head>
<body>
    
    <div>
        我是一个div
    </div>
</body>
</html>
