<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css交集并集选择器</title>

    <style>
        
        div.box,
        p,
        #box{
            color:red
        }
        
    </style>
</head>
<body>

    <div>我是一个class=box的div元素</div>
    <div class="box">我是一个class=box的div元素</div>
    <p class="box">我是一个class=box的p元素</p>
    
</body>
</html>
