<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        body,html{
            height: 100%;
            width: 100%;
            background-color: pink;
            /* margin: 0; */
            
        }
        body{
            /* padding-right: 100px; */
        }
        /* div{
            width: 200px;
            height: 200px;
            background-color: cyan;
            position: absolute;
            top: 0;
            right: 0;
        } */
        div.bg{
            height: 1000px;
            width: 20px;
            background-color: darkblue;
        }
        div.fixed-box{
            width: 200px;
            height: 200px;
            background-color: cyan;
            position: fixed;
            top: 10px;
            left: 30px;
            z-index: 3;
        }
        div.absolute-box{
            width: 300px;
            height: 300px;
            background-color:#efefef;
            position: absolute;
            top: 10px;
            left: 30px;
            z-index: 2;
        }

        p{
            position: absolute;
            top: 0;
            right: 0;
        }
        
    </style>
</head>
<body>
    <div class="bg">

    </div>
    <div class="absolute-box">
        
    </div>
    <div class="fixed-box">
        <p>我是一个p标签</p>
    </div>

    
</body>
</html>
