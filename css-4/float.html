<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float</title>
    <style lang="">
        div{
            /* width: 500px;
            height: 300px; */
            background-color: pink;
            overflow: hidden;
        }
        div::after{
            content: "";
            display: block;
            height: 0;
            clear: both;
            visibility: hidden;
        }
        .sp2{
          float: left;
          /* clear: right; */
        }
        .sp1{
          float: right;
        }
        /* .clear-box{
            clear: both;
        } */
    </style>
</head>
<body>
    <div>
        <span class="sp1">我是1个span</span>
        <span class="sp2">我是2个span</span>
    </div>
    <!-- <div class="clear-box"></div> -->
    <p>我是一段文案</p>
</body>
</html>
