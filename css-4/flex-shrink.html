<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-shrink</title>
    <style>
        *{
            margin: 0;
        }
        div{
            height: 500px;
            width: 300px;
            background-color: pink;
            display: flex;
            align-items: flex-start;
        }
        div>*{
            width: 60px;
            background-color: aquamarine;
        }
        div span{
            /* auto|stretch|center|flex-start|flex-end|baseline; */
            align-self: baseline;
        }
       
    </style>
</head>
<body>
    <div>
        <p style="order: 3;flex-shrink:2">1</p>
        <p style="order: 4;flex-shrink:1">2</p>
        <span style="order: 1;flex-shrink:1">3</span>
        <span style="order: 2;flex-shrink:1">4</span>
    </div>
</body>
</html>
