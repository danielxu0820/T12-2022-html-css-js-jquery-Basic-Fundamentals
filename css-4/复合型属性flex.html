<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复合型属性flex</title>
    <style>
        *{
            margin: 0;
        }
        div{
            height: 500px;
            width: 300px;
            background-color: pink;
            display: flex;
            align-items: flex-start;
        }
        div>*{
            width: 60px;
            background-color: aquamarine;
        }
        div span{
            flex: 1 0 20px;

        }
       
    </style>
</head>
<body>
    <div>
        <p >1</p>
        <p >2</p>
        <span >3</span>
        <span >4</span>
    </div>
</body>
</html>
