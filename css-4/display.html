<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <style>
        div{
           display: inline; 
           width: 100px;
           height: 100px;
           background-color: pink;
        }
        span{
            width: 100px;
            height: 100px;
            background-color: aquamarine; 
            /* display: block; */
            display: inline-block;
            display: none;
        }
    </style>
</head>
<body>
    <div>我是一个div</div>
    <span>我是一个span</span>
</body>
</html>
